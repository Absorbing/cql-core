name: PHPDoc Coverage Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  phpdoc-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPDoc Checker and output coverage
        run: |
          output=$(vendor/bin/phpdoc-checker check src/ --json=- || true)
          echo "PHPDoc Checker Output:"
          echo "$output"
          
          total=$(echo "$output" | jq '.counts.total // 0')
          missing=$(echo "$output" | jq '.counts.missing // 0')

          if [ "$total" -eq 0 ]; then
            echo "No PHP files or PHPDoc found."
          else
            coverage=$(jq -n "($total - $missing) / $total * 100" | xargs printf "%.2f")
            echo "PHPDoc coverage: $coverage%"
          fi

      - name: Save PHPDoc Checker Report
        run: |
          vendor/bin/phpdoc-checker check src/ > phpdoc-report.txt || true

      - name: Upload PHPDoc Report
        uses: actions/upload-artifact@v4
        with:
          name: phpdoc-report
          path: phpdoc-report.txt