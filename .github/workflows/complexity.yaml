name: PHP Code Quality Check

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  phpmd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install PHPMD
        run: composer global require phpmd/phpmd

      - name: Run PHPMD (All Rulesets)
        run: |
          echo "Running PHPMD with all rulesets..."
          phpmd src text codesize,cleancode,controversial,design,naming,unusedcode